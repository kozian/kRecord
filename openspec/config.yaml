schema: spec-driven

context: |
  kRecord: native macOS audio recorder (microphone + system audio) for personal use; planned open-source release.
  Platform: macOS 15+ only, Apple silicon (M1 and newer). Built with Xcode 27, Swift 6 language mode (strict concurrency), SwiftUI.
  Use only Apple system frameworks (Core Audio, AVFoundation, AudioToolbox, SwiftUI); avoid third-party dependencies.
  App Sandbox enabled. No distribution, auto-update, or App Store work in current scope.
  All OpenSpec artifacts are written in English. App UI is localized in English and Russian (String Catalog).

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
